services:
  postgres:
    image: postgres:16-alpine
    container_name: test_postgres
    environment:
      POSTGRES_DB: racingdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d racingdb"]
      interval: 2s
      timeout: 3s
      retries: 5
