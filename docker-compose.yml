services:
  postgres:
    image: postgres:16-alpine
    container_name: test_postgres
    environment:
      POSTGRES_DB: racingdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      # Run in name order on a fresh container: schema first, then data.
      - ./init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d racingdb"]
      interval: 2s
      timeout: 3s
      retries: 5
