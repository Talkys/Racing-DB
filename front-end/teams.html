<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - RaceDB.org</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="body-class">

<div class="page">
    <div class="checkered-bar"></div>

    <header class="header">
        <div>
            <h1 class="logo-title"><a href="index.html" class="no-underline hover:no-underline">RaceDB<small>.org</small></a></h1>
            <div class="logo-tagline">The Internet Motorsport Database - Since 1999</div>
        </div>
        <form action="#" class="m-0 text-right" data-header-search>
            <label for="header-q" class="search-label">Search Database:</label>
            <input type="text" id="header-q" name="q" size="14" class="field">
            <select name="type" class="field">
                <option value="drivers.html" data-col="last_name">Drivers</option>
                <option value="cars.html" data-col="name">Cars</option>
                <option value="races.html" data-col="name">Grand Prix</option>
                <option value="circuits.html" data-col="name">Circuits</option>
                <option value="teams.html" data-col="name">Teams</option>
                <option value="articles.html" data-col="title">Articles</option>
            </select>
            <button type="submit" class="btn">Go!</button>
        </form>
    </header>

    <nav class="nav-bar">
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="drivers.html">Drivers</a>
        <a href="races.html">Races</a>
        <a href="circuits.html">Circuits</a>
        <a href="teams.html" aria-current="page">Teams</a>
        <a href="cars.html">Cars</a>
        <a href="engines.html">Engines</a>
        <a href="chassis.html">Chassis</a>
        <a href="articles.html">Articles</a>
    </nav>

    <div class="p-1.5">
        <div class="box-title">Teams</div>
        <div class="box-content">
            <form method="GET" class="filter-form" data-search-form>
                <label>Filter:
                    <select name="col" class="field">
                <option value="name" data-kind="text">Name</option>
                <option value="short_name" data-kind="text">Short name</option>
                <option value="country" data-kind="text">Country</option>
                <option value="founded_year" data-kind="number">Founded</option>
                    </select>
                </label>
                <select name="op" class="field">
                <option value="ilike" data-kinds="text">contains</option>
                <option value="eq" data-kinds="text number bool">equals</option>
                <option value="neq" data-kinds="text">is not</option>
                <option value="gt" data-kinds="number">&gt;</option>
                <option value="gte" data-kinds="number">&ge;</option>
                <option value="lt" data-kinds="number">&lt;</option>
                <option value="lte" data-kinds="number">&le;</option>
                </select>
                <input type="text" name="q" size="18" class="field">
                <button type="submit" class="btn">Search</button>
                <a href="teams.html">Reset</a>
            </form>

            <table class="data-table">
                <thead>
                    <tr>
                    <th><a data-sort="name">Name</a></th>
                    <th>Short name</th>
                    <th>Country</th>
                    <th>Founded</th>
                    </tr>
                </thead>
                <tbody>
                    <template>
                        <tr>
                        <td data-field="name"></td>
                        <td data-field="short_name"></td>
                        <td data-field="country"></td>
                        <td data-field="founded_year"></td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <p data-empty hidden class="my-1.5">No results.</p>
            <p data-error hidden class="my-1.5 text-flame"></p>

            <div class="pager">
                <span><a data-prev hidden>&lt;&lt; Previous</a></span>
                <span>Page <span data-page>1</span></span>
                <span><a data-next hidden>Next &gt;&gt;</a></span>
            </div>
        </div>
    </div>

    <div class="checkered-bar"></div>

    <footer class="footer">
        &copy; 1999–2003 RaceDB Interactive Systems Ltd. All Rights Reserved.
    </footer>

</div>

<script type="module" src="/src/lib/header.ts"></script>
<script type="module" src="/src/pages/teams.ts"></script>
</body>
</html>
