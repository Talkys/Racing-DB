  /articles/search:
    get:
      description: 'Full-text search over article titles, summaries and bodies: whole
        words, case-insensitive, no stemming. Supports "quoted phrases", or, and -exclusion.
        One result per article, using the text in `lang` when it qualifies. Without
        `q`, lists every article newest first. Returns up to 26 rows: the 26th only
        signals that a next page exists.'
      operationId: search-articles-text
      parameters:
      - description: Search words (max 200 characters); omit to browse
        in: query
        name: q
        type: string
      - description: Preferred text language, e.g. pt-br
        in: query
        name: lang
        type: string
      - description: 'Page number for pagination (default: 1)'
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/articlesearch.ArticleSearchResult'
            type: array
        "400":
          description: Invalid q, lang or page
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Search articles
      tags:
      - articles
