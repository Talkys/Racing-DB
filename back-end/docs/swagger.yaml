definitions:
  category.Category:
    properties:
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Retrieve a list of categories filtered, sorted, and paginated by
        query criteria
      operationId: search-categories
      parameters:
      - description: 'Page number for pagination (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Filter expression in format: column,operator,value (e.g. name,eq,electronics)'
        in: query
        name: filter
        type: string
      - description: 'Sort expression in format: column,direction (e.g. name,asc)'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of matching categories
          schema:
            items:
              $ref: '#/definitions/category.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search categories
swagger: "2.0"
