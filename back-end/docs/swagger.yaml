basePath: /api/1
definitions:
  article.Article:
    properties:
      created_at:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      kind:
        type: string
      published_at:
        type: string
    type: object
  articlesearch.ArticleSearchResult:
    properties:
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      kind:
        type: string
      language:
        type: string
      preview:
        items:
          $ref: '#/definitions/articlesearch.PreviewSegment'
        type: array
      published_at:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  articlesearch.PreviewSegment:
    properties:
      match:
        type: boolean
      text:
        type: string
    type: object
  articletext.ArticleText:
    properties:
      article_id:
        type: string
      body_md:
        type: string
      created_at:
        type: string
      id:
        type: string
      language:
        type: string
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  car.Car:
    properties:
      category_id:
        type: string
      chassis_id:
        type: string
      created_at:
        type: string
      engine_id:
        type: string
      id:
        type: string
      name:
        type: string
      parts:
        description: as stored, even when invalid
        type: object
      parts_errors:
        items:
          type: string
        type: array
      parts_valid:
        description: PartsValid is false when Parts breaks the contract (spec 3.4);
          PartsErrors then says how.
        type: boolean
      season:
        type: integer
      team_id:
        type: string
    type: object
  category.Category:
    properties:
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  chassis.Chassis:
    properties:
      created_at:
        type: string
      id:
        type: string
      manufacturer:
        type: string
      material:
        type: string
      name:
        type: string
      weight_kg:
        type: number
      wheelbase_mm:
        type: integer
    type: object
  circuit.Circuit:
    properties:
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      length_km:
        type: number
      location:
        type: string
      name:
        type: string
    type: object
  driver.Driver:
    properties:
      code:
        type: string
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      nationality:
        type: string
    type: object
  engine.Engine:
    properties:
      aspiration:
        type: string
      configuration:
        type: string
      created_at:
        type: string
      cylinders:
        type: integer
      displacement_cc:
        type: integer
      id:
        type: string
      manufacturer:
        type: string
      name:
        type: string
      power_kw:
        type: number
    type: object
  race.Race:
    properties:
      category_id:
        type: string
      circuit_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      payload:
        description: as stored, even when invalid
        type: object
      payload_errors:
        items:
          type: string
        type: array
      payload_valid:
        description: PayloadValid is false when Payload breaks its category's contract
          (spec 3.3); PayloadErrors then says how.
        type: boolean
      race_date:
        type: string
      round:
        type: integer
      season:
        type: integer
      winner_id:
        type: string
    type: object
  routes.ErrorResponse:
    properties:
      error:
        type: string
      status:
        type: integer
    type: object
  team.Team:
    properties:
      country:
        type: string
      created_at:
        type: string
      founded_year:
        type: integer
      id:
        type: string
      name:
        type: string
      short_name:
        type: string
    type: object
info:
  contact: {}
  description: 'Read-only racing database: categories, circuits, drivers, races, teams,
    engines, chassis, cars and articles.'
  title: RacingDB API
  version: "1"
paths:
  /article-texts:
    get:
      description: 'Retrieve a page of article texts filtered and sorted by query
        criteria. Returns up to 26 rows: the 26th only signals that a next page exists.'
      operationId: search-article-texts
      parameters:
      - description: 'Page number for pagination (default: 1)'
        in: query
        name: page
        type: integer
      - collectionFormat: multi
        description: 'Filter expression column,operator,value (operators: eq neq gt
          gte lt lte ilike in; in takes values separated by |). Repeat it to AND several
          filters.'
        in: query
        items:
          type: string
        name: filter
        type: array
      - collectionFormat: multi
        description: 'Comma-separated columns, each optionally followed by asc or
          desc (e.g. title,desc), in priority order; may be repeated. Sortable: title,
          language'
        in: query
        items:
          type: string
        name: sort
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: List of matching article texts
          schema:
            items:
              $ref: '#/definitions/articletext.ArticleText'
            type: array
        "400":
          description: Invalid page, filter or sort
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Search article texts
      tags:
      - article-texts
  /article-texts/{id}:
    get:
      operationId: get-article-texts
      parameters:
      - description: ArticleText UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/articletext.ArticleText'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      summary: Get an article text
      tags:
      - article-texts
  /articles:
    get:
      description: 'Retrieve a page of articles filtered and sorted by query criteria.
